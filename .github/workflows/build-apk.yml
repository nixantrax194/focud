name: Build Study Focus APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Finds the Android project automatically (repo root OR any sub-folder)
      - name: Locate Android project
        run: |
          set -e
          SETTINGS=$(find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found in the repository."
            echo "Repository files:"
            find . -maxdepth 3 -not -path "./.git/*" | sort
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"

          cd "$DIR"
          echo "----- project root -----"
          ls -la

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::app/build.gradle is missing. Check the folder name is exactly 'app'."
            find . -maxdepth 3 -not -path "./.git/*" | sort
            exit 1
          fi

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::app/src/main/AndroidManifest.xml is missing. Check the folder is named 'src' (not 'scr')."
            find app -maxdepth 4 | sort
            exit 1
          fi

          echo "Project structure OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFocus-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
