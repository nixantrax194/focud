name: Build Study Focus APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses > /dev/null || true


      # 5. Check project structure
      - name: Check project structure
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo ""
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "===== STUDYFOCUS PROJECT ====="
          ls -la StudyFocusAndroid
          ls -la StudyFocusAndroid/app


      # 6. Install Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # 7. Verify Gradle
      - name: Check Gradle
        run: |
          gradle --version


      # 8. Check Gradle modules
      - name: Check Gradle projects
        working-directory: StudyFocusAndroid
        run: |
          gradle projects --no-daemon --stacktrace


      # 9. Build APK
      - name: Build Study Focus APK
        working-directory: StudyFocusAndroid
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # 10. Find APK
      - name: Find generated APK
        run: |
          echo "===== GENERATED APK ====="
          find StudyFocusAndroid/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # 11. Upload APK
      - name: Upload Study Focus APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFocus-debug-apk
          path: StudyFocusAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
