name: Build Study Focus APK

on:
  workflow_dispatch:

  # Also build automatically whenever code is pushed to main.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Download repository
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v6


      # ---------------------------------------------------------
      # 2. Install Java 17
      # ---------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ---------------------------------------------------------
      # 3. Set up Android SDK
      #
      # IMPORTANT:
      # Do NOT add the deprecated "tools" package.
      # ---------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true


      # ---------------------------------------------------------
      # 4. Show Android/Java versions
      # Useful for debugging if something goes wrong.
      # ---------------------------------------------------------
      - name: Check build environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "===== ADB ====="
          adb --version

          echo ""
          echo "===== SDK PACKAGES ====="
          sdkmanager --list_installed | head -100


      # ---------------------------------------------------------
      # 5. Install Gradle 8.9
      #
      # Your project uses Android Gradle Plugin 8.7.x,
      # so Gradle 8.9 is used here.
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ---------------------------------------------------------
      # 6. Verify Gradle
      # ---------------------------------------------------------
      - name: Check Gradle
        run: |
          gradle --version


      # ---------------------------------------------------------
      # 7. Make sure Gradle can execute
      # ---------------------------------------------------------
      - name: Prepare project
        run: |
          chmod +x gradlew 2>/dev/null || true


      # ---------------------------------------------------------
      # 8. Build DEBUG APK
      # ---------------------------------------------------------
      - name: Build Study Focus APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ---------------------------------------------------------
      # 9. Show generated APK
      # ---------------------------------------------------------
      - name: Find generated APK
        run: |
          echo "===== GENERATED APK FILES ====="
          find app/build/outputs/apk -type f -name "*.apk" -print


      # ---------------------------------------------------------
      # 10. Upload APK to GitHub
      # ---------------------------------------------------------
      - name: Upload Study Focus APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFocus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
