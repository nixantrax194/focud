<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Study Focus 2.0</title><meta name="theme-color" content="#0B0F0D"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Study Focus">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:400 15px/1.45 Inter,Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

.btn.s{background:var(--el);color:var(--tx)}.btn.d{background:none;color:var(--dg);border:1.5px solid var(--dg)}.btn.sm{width:auto;min-height:44px;font-size:15px;padding:0 18px}
.rw{position:relative;width:min(300px,78vw);margin:18px auto}.ring{width:100%;display:block}
.ri{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tm{font-size:64px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}

.big{font-size:24px;font-weight:700}
.bars{display:flex;gap:8px;align-items:flex-end;height:110px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--mu)}
.bars i{display:block;width:100%;background:var(--pr);border-radius:6px;min-height:3px}
.sb{height:8px;border-radius:4px;background:var(--el);margin:6px 0 12px}.sb i{display:block;height:100%;border-radius:4px;background:var(--pr)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--dv);z-index:5}
nav button{flex:1;max-width:200px;min-height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--mu)}
nav button.on{color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent);font-weight:600}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet>div{max-width:620px;margin:0 auto;padding:18px 18px 60px}
label{display:block;font-weight:600;margin:20px 0 8px}
input[type=text],input[type=number],input[type=time],input[type=date]{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--sf);border:1.5px solid var(--dv);color-scheme:dark}
:root[data-theme=light] input{color-scheme:light}
.tg{width:52px;height:30px;border-radius:15px;background:var(--dv);position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--pr)}.tg.on:after{left:25px}
.tag{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--el);color:var(--mu);font-weight:600}
.cd{background:var(--sf);border-radius:24px;padding:22px;margin-bottom:14px;border-left:5px solid var(--ac)}
.cd .n{font-size:40px;font-weight:800;color:var(--ac);line-height:1.1;margin:6px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--el);padding:12px 20px;border-radius:24px;z-index:20;box-shadow:0 4px 20px #0006}
@media(min-width:820px){main,.sheet>div{max-width:900px}.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),K='studyfocus1',CATS=['Board Exam','Entrance Exam','Test','Assignment','Personal Goal','Custom'],DN=['S','M','T','W','T','F','S'];
const D=()=>({tags:['Physics','Chemistry','Zoology','Botany','Maths','English'],ses:[],sch:[],occ:{},cds:[null,null,null],set:{goal:180,dur:45,brk:5,theme:'dark',dis:true,strict:false},sel:'Physics',dur:45,run:null});
let S;try{S=Object.assign(D(),JSON.parse(localStorage[K]||'{}'))}catch(e){S=D()}
let T='focus',V=null,F=null,G=null,fired={},cust=false;

const mmss=s=>{s=Math.max(0,Math.ceil(s));return p2(Math.floor(s/60))+':'+p2(s%60)};
const f12=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+p2(m)+' '+(h<12?'AM':'PM')};
const fd=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
const secsOn=k=>S.ses.filter(x=>dk(x.start)==k).reduce((a,x)=>a+x.sec,0);
const lastDays=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d});
function streak(){let n=0;const d=new Date();if(!secsOn(dk(d)))d.setDate(d.getDate()-1);while(secsOn(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
const appl=(s,d)=>s.rep=='once'?s.date==dk(d):s.rep=='daily'||(s.days||[]).includes(d.getDay());
function nextSch(){const now=new Date();let best=null;S.sch.filter(s=>s.on).forEach(s=>{for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()+i);if(!appl(s,d))continue;const[h,m]=s.time.split(':');d.setHours(+h,+m,0,0);if(d>now&&!S.occ[s.id+dk(d)]){if(!best||d<best.d)best={s,d};break}}});return best}
const left=()=>{const r=S.run;return r.pause!=null?r.pause:(r.endAt-Date.now())/1000};
function start(tag,min,sched,mode){S.run={tag,mode:mode||'focus',total:min*60,endAt:Date.now()+min*6e4,pause:null,start:Date.now(),sched:sched||null};V=null;T='focus';save();try{if(window.Android&&mode!='break')Android.startFocus(tag,min*60)}catch(e){}render()}
function endRun(done){const r=S.run;if(!r)return;let msg=null;
 if(r.mode=='focus'){const sec=done?r.total:Math.round(r.total-left());
  if(sec>=60){S.ses.push({id:Date.now(),tag:r.tag,start:r.start,end:Date.now(),sec,status:done?'completed':'interrupted',note:''})}
  if(r.sched&&done)S.occ[r.sched+dk(new Date())]='completed';
  S.run=null;V=done?{t:'done',tag:r.tag,min:Math.round(sec/60)}:null;try{if(window.Android&&r.mode!='break')Android.stopFocus()}catch(e){}if(done)navigator.vibrate&&navigator.vibrate(300)}
 else{S.run=null;V=null;msg='Break finished. Ready for another session?'}

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function cdText(c){const at=new Date(c.at),df=at-Date.now();if(df<=0)return`<div class="n">${dk(at)==dk(new Date())?'TODAY':"TIME'S UP"}</div>`;
 const d=Math.floor(df/864e5),h=Math.floor(df%864e5/36e5),m=Math.floor(df%36e5/6e4),s=Math.floor(df%6e4/1e3);
 return`<div class="n">${d} ${d==1?'DAY':'DAYS'}</div><div class="mu">${p2(h)} HR ${p2(m)} MIN ${p2(s)} SEC</div>`}
function tick(){const r=S.run;
 if(r){const l=left();if(l<=0){endRun(true);return}const t=$('#tm');if(t)t.textContent=mmss(l);const g=$('#ring');if(g)g.style.strokeDashoffset=678.6*(l/r.total)}
 S.cds.forEach((c,i)=>{const e=$('#c'+i);if(c&&e)e.innerHTML=cdText(c)});
 if(!r&&!(V&&V.t=='alarm')){const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  S.sch.forEach(s=>{if(!s.on||s.rem<0||!appl(s,n))return;const k=s.id+dk(n);if(S.occ[k]||fired[k])return;const[h,m]=s.time.split(':');
   if(nm==+h*60+ +m-s.rem){fired[k]=1;V={t:'alarm',s};try{if(window.Notification&&Notification.permission=='granted')new Notification(s.name,{body:'Time to study '+s.tag+' for '+s.dur+' minutes.'})}catch(e){}navigator.vibrate&&navigator.vibrate([300,150,300]);render()}})}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.run&&S.run.mode=='focus'&&S.run.pause==null&&S.set.dis&&!V){V={t:'stay'};render()}});
setInterval(tick,1000);
const ring=(p,id)=>`<svg viewBox="0 0 240 240" class="ring" role="img" aria-label="Progress ring"><circle cx="120" cy="120" r="108" fill="none" stroke="var(--el)" stroke-width="12"/><circle ${id?'id="ring"':''} cx="120" cy="120" r="108" fill="none" stroke="var(--pr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="${678.6*(1-p)}" transform="rotate(-90 120 120)" style="transition:stroke-dashoffset 1s linear"/></svg>`;
const tg=(on,fn)=>`<button class="tg ${on?'on':''}" role="switch" aria-checked="${!!on}" onclick="${fn}"></button>`;
const go=k=>{T=k;V=null;render()},op=(t,x)=>{V=Object.assign({t},x||{});render()},cl=()=>{V=null;F=null;G=null;render()};
const pick=i=>{S.sel=S.tags[i];save();render()},setDur=m=>{S.dur=m;cust=false;save();render()};
function focusV(){const r=S.run,n=S.ses.filter(x=>dk(x.start)==dk(new Date())).length;
 const head=`<div class="hd"><div><h1>Focus</h1><p class="mu">Ready for your next focused session?</p></div><button class="ib" aria-label="Settings" onclick="op('settings')">⚙</button></div>`;
 let top;
 if(r){const l=left(),b=r.mode=='break';
  top=`<div class="rw">${ring(1-l/r.total,1)}<div class="ri"><div class="mu">${b?'Break time ☕':esc(r.tag)}</div><div class="tm" id="tm" aria-live="off">${mmss(l)}</div><div class="mu">${r.pause!=null?'Paused':'remaining'}</div></div></div>
  <p class="c mu">${b?'Rest your eyes. You earned it.':'Session '+(n+1)+' today'}</p><div class="row wr" style="margin-top:16px">
  ${b?`<button class="btn s" onclick="endRun(true)">Skip Break</button>`:`${S.set.strict?'':`<button class="btn s" style="flex:1" onclick="pz()">${r.pause!=null?'Resume':'Pause'}</button>`}<button class="btn s" style="flex:1" onclick="ext()">+5 min</button><button class="btn ${S.set.strict?'d':''}" style="flex:1" onclick="endRun(false)">${S.set.strict?'Emergency exit':'Finish'}</button>`}</div>`}
 else top=`<h2 style="margin-top:22px">What are you studying?</h2><div class="chips">${S.tags.map((t,i)=>`<button class="chip ${t==S.sel?'on':''}" onclick="pick(${i})">${esc(t)}</button>`).join('')}<button class="chip" onclick="op('tags')">+ Add tag</button></div>
  <div class="rw">${ring(0)}<div class="ri"><div class="tm">${p2(S.dur)}:00</div><div class="mu">Focus Session</div><div style="font-weight:600">${esc(S.sel)}</div></div></div>
  <div class="chips" style="justify-content:center">${[25,45,50,60].map(m=>`<button class="chip ${S.dur==m&&!cust?'on':''}" onclick="setDur(${m})">${m} min</button>`).join('')}<button class="chip ${cust?'on':''}" onclick="cust=true;render()">Custom</button></div>
  ${cust?`<input type="number" min="1" max="240" value="${S.dur}" aria-label="Custom minutes" onchange="S.dur=Math.min(240,Math.max(1,+this.value||45));save();render()" style="margin-bottom:12px">`:''}
  <p class="c mu" style="margin-bottom:14px">Focus goal: ${hm(S.set.goal*60)} today</p><button class="btn" onclick="start(S.sel,S.dur)">Start Focus</button>`;
 const wk=lastDays(7),tot=wk.map(d=>secsOn(dk(d))),today=tot[6],mx=Math.max(S.set.goal*60,...tot),ns=nextSch(),cd=S.cds.filter(Boolean).filter(c=>new Date(c.at)>new Date()).sort((a,b)=>new Date(a.at)-new Date(b.at))[0];
 const by={};S.ses.filter(x=>wk.some(d=>dk(d)==dk(x.start))).forEach(x=>by[x.tag]=(by[x.tag]||0)+x.sec);const bl=Object.entries(by).sort((a,b)=>b[1]-a[1]),bm=bl[0]?bl[0][1]:1;
 const pct=Math.min(100,Math.round(today/(S.set.goal*60)*100));
 const prog=`<div class="card"><div class="row sp"><div><div class="mu">Today's Focus</div><div class="big">${hm(today)} <span class="mu" style="font-size:15px;font-weight:400">/ ${hm(S.set.goal*60)} goal</span></div><div class="mu">${n} ${n==1?'session':'sessions'}</div></div><div style="width:72px;position:relative">${ring(pct/100)}<div class="ri" style="font-weight:700;font-size:15px">${pct}%</div></div></div></div>
 <div class="card"><div class="mu">Next schedule</div>${ns?`<div style="font-weight:600;font-size:17px">${esc(ns.s.name)}</div><div class="mu">${ns.d.toDateString()==new Date().toDateString()?'Today':ns.d.toLocaleDateString(undefined,{weekday:'short'})} • ${f12(ns.s.time)} • ${ns.s.dur} min</div>`:`<div class="mu">Nothing scheduled.</div>`}</div>
 <div class="card"><div class="mu">Upcoming</div>${cd?`<div style="font-weight:600;font-size:17px">${esc(cd.name)} • ${Math.ceil((new Date(cd.at)-Date.now())/864e5)} days</div>`:`<div class="mu">No important dates yet.</div>`}</div>
 <h2>Your Progress</h2><div class="grid"><div class="card"><div class="mu">Today</div><div class="big">${hm(today)}</div></div><div class="card"><div class="mu">This week</div><div class="big">${hm(tot.reduce((a,b)=>a+b,0))}</div></div><div class="card"><div class="mu">Current streak</div><div class="big">${streak()} days</div></div><div class="card"><div class="mu">Goal</div><div class="big">${hm(S.set.goal*60)}/day</div></div></div>
 <div style="height:12px"></div>${trend()}<div class="card"><div class="mu" style="margin-bottom:10px">Daily focus, last 7 days</div><div class="bars">${wk.map((d,i)=>`<div title="${hm(tot[i])}"><i style="height:${Math.max(3,tot[i]/mx*80)}px"></i>${DN[d.getDay()]}</div>`).join('')}</div></div>
 <div class="card"><div class="mu" style="margin-bottom:10px">Subjects this week</div>${bl.length?bl.map(([t,s])=>`<div class="row sp"><span>${esc(t)}</span><b>${hm(s)}</b></div><div class="sb"><i style="width:${s/bm*100}%"></i></div>`).join(''):`<div style="font-weight:600">Your study journey starts here.</div><div class="mu">Complete your first focus session.</div>`}</div>
 <button class="btn s" onclick="op('hist')">View all history</button>`;
 return head+`<div class="two"><div>${top}</div><div>${prog}</div></div>`}
let rng=7;
function trend(){const n=rng,ds=lastDays(n),v=ds.map(d=>secsOn(dk(d))/60),g=S.set.goal,mx=Math.max(g,...v,1)*1.15,H=130,x=i=>10+i*280/(n-1),y=a=>H-18-a/mx*(H-30);
 const pts=v.map((a,i)=>x(i).toFixed(1)+','+y(a).toFixed(1)).join(' '),tot=v.reduce((a,b)=>a+b,0),dl=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
 return`<div class="card"><div class="row sp"><div><div class="mu">Progress trend</div><b>${hm(tot*60)} in ${n} days</b></div><div class="row" style="gap:6px">${[7,30].map(k=>`<button class="chip ${rng==k?'on':''}" style="min-height:40px;padding:0 14px" onclick="rng=${k};render()">${k}d</button>`).join('')}</div></div>
 <svg viewBox="0 0 300 ${H}" style="width:100%;margin-top:8px" role="img" aria-label="Focus minutes per day over ${n} days"><line x1="10" x2="290" y1="${y(g)}" y2="${y(g)}" stroke="var(--wn)" stroke-dasharray="4 4"/><polygon points="${x(0)},${H-18} ${pts} ${x(n-1)},${H-18}" fill="var(--pr)" opacity=".15"/><polyline points="${pts}" fill="none" stroke="var(--pr)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${n<=7?v.map((a,i)=>`<circle cx="${x(i)}" cy="${y(a)}" r="3.5" fill="var(--pr)"/>`).join(''):''}<text x="10" y="${H-3}" font-size="10" fill="var(--mu)">${dl(ds[0])}</text><text x="290" y="${H-3}" font-size="10" text-anchor="end" fill="var(--mu)">Today</text></svg>
 <div class="mu" style="font-size:12px">Dashed line = your ${hm(g*60)} daily goal</div></div>`}
function pz(){const r=S.run;if(r.pause!=null){r.endAt=Date.now()+r.pause*1000;r.pause=null;try{if(window.Android)Android.resumeFocus()}catch(e){}}else{r.pause=left();try{if(window.Android)Android.pauseFocus()}catch(e){}}save();render()}
function ext(){const r=S.run;r.total+=300;if(r.pause!=null)r.pause+=300;else r.endAt+=3e5;try{if(window.Android)Android.addFive()}catch(e){}save();render()}
function schedV(){const ns=nextSch(),wk=lastDays(0),sun=new Date();sun.setDate(sun.getDate()-sun.getDay());
 const rep=s=>s.rep=='once'?fd(s.date):s.rep=='daily'?'Every day':s.days.map(d=>DN[d]).join(' ');
 return`<div class="hd"><div><h1>Study Schedule</h1><p class="mu">${ns?'Next: '+esc(ns.s.name)+' at '+f12(ns.s.time):'Plan your sessions.'}</p></div><button class="btn sm" onclick="newS()">+ Add Schedule</button></div><div style="margin-top:20px">
 ${S.sch.length?S.sch.map((s,i)=>{const k=s.id+dk(new Date()),st=!s.on?'Off':S.occ[k]=='completed'?'Completed':S.occ[k]=='skipped'?'Skipped':'Scheduled';
 return`<div class="card" style="${s.on?'':'opacity:.6'}"><div class="row sp"><div><div style="font-weight:600;font-size:17px">${esc(s.name)}</div><div class="mu">${rep(s)} • ${f12(s.time)}</div><div class="mu">${s.dur} min</div></div><div style="text-align:right"><span class="tag">${esc(s.tag)}</span><div class="mu" style="margin-top:6px">${st}</div></div></div>
 <div class="row sp" style="margin:12px 0;font-size:13px">${[0,1,2,3,4,5,6].map(j=>{const d=new Date(sun);d.setDate(sun.getDate()+j);const o=S.occ[s.id+dk(d)];return`<span class="c" style="flex:1"><span class="mu">${DN[j]}</span><br><b aria-label="${o||'none'}">${!appl(s,d)?'–':o=='completed'?'✓':o=='skipped'?'×':'○'}</b></span>`}).join('')}</div>
 <div class="row"><button class="btn sm" onclick="start(S.sch[${i}].tag,S.sch[${i}].dur,S.sch[${i}].id)">Start</button><button class="btn sm s" onclick="editS(${i})">Edit</button><span style="flex:1"></span>${tg(s.on,`S.sch[${i}].on=!S.sch[${i}].on;save();render()`)}</div></div>`}).join(''):`<div class="card c"><div style="font-weight:600">No study sessions scheduled.</div><div class="mu">Add a schedule so you don't have to remember everything.</div></div>`}</div>`}
const newS=()=>{F={name:'',tag:S.sel,time:'19:00',dur:45,rep:'daily',days:[1,2,3,4,5],date:dk(new Date()),rem:0};op('sched')},editS=i=>{F=JSON.parse(JSON.stringify(S.sch[i]));op('sched')};
const fs=(k,v)=>{F[k]=v;render()};
function saveS(){try{if(F.rem>=0&&window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}const n=F.name.trim()||F.tag+' session';F.name=n;F.dur=Math.min(240,Math.max(1,+F.dur||45));if(F.rep=='days'&&!F.days.length)F.days=[new Date().getDay()];
 const i=S.sch.findIndex(s=>s.id==F.id);if(i>=0)S.sch[i]=F;else{F.id='s'+Date.now();F.on=true;S.sch.push(F)}save();cl()}
function cdV(){return`<div class="hd"><div><h1>Important Countdowns</h1><p class="mu">Keep your exams and deadlines in sight.</p></div></div><div style="margin-top:20px">
 ${S.cds.map((c,i)=>c?`<div class="cd"><div style="font-weight:600;letter-spacing:.5px">${esc(c.name.toUpperCase())}</div><div id="c${i}">${cdText(c)}</div><div style="margin:12px 0">${fd(c.at.slice(0,10))}<br><span class="mu">${f12(c.at.slice(11,16))} • ${esc(c.cat)}</span></div><button class="btn sm s" onclick="editC(${i})">Edit</button></div>`
 :`<button class="cd c" style="width:100%;border-left-color:var(--dv);padding:34px" onclick="newC(${i})"><div style="font-weight:600;font-size:17px">+ Add Countdown</div><div class="mu">No important dates yet. Add an exam or deadline.</div></button>`).join('')}</div>`}
const newC=i=>{G={i,name:'',date:'',time:'09:00',cat:'Board Exam'};op('cd')},editC=i=>{const c=S.cds[i];G={i,name:c.name,date:c.at.slice(0,10),time:c.at.slice(11,16),cat:c.cat,edit:1};op('cd')};
function saveC(){if(!G.name.trim()||!G.date){toast('Add a name and a date');return}S.cds[G.i]={name:G.name.trim(),at:G.date+'T'+G.time,cat:G.cat};save();cl()}
const hdr=t=>`<div class="row"><button class="ib" aria-label="Back" onclick="cl()">←</button><h1 style="font-size:24px">${t}</h1></div>`;
function sheet(){const v=V;
 if(v.t=='done')return`<div class="sheet"><div class="c" style="padding-top:12vh"><div style="font-size:56px">✓</div><h1>Great work!</h1><p class="mu" style="margin:6px 0 24px">${v.min} min of ${esc(v.tag)} completed.</p><input type="text" id="note" placeholder="Add a note (optional)" aria-label="Note" style="margin-bottom:16px"><div style="display:grid;gap:10px"><button class="btn" onclick="nt();start('Break',S.set.brk,null,'break')">Start ${S.set.brk} min break</button><button class="btn s" onclick="nt();start(S.sel,S.dur)">Start another session</button><button class="btn s" onclick="nt();cl()">Done</button></div></div></div>`;
 if(v.t=='stay'){const r=S.run;return`<div class="sheet"><div class="c" style="padding-top:14vh"><h1>Stay focused</h1><p class="mu" style="margin:10px 0 28px">You are in a ${esc(r.tag)} focus session. ${mmss(left())} remaining.</p><div style="display:grid;gap:10px"><button class="btn" onclick="cl()">Go Back to Focus</button><button class="btn d" onclick="endRun(false)">Exit Focus</button></div></div></div>`}
 if(v.t=='alarm'){const s=v.s;return`<div class="sheet"><div class="c" style="padding-top:14vh"><div style="font-size:48px">⏰</div><h1>${esc(s.name)}</h1><p class="mu" style="margin:10px 0 28px">Time to study ${esc(s.tag)} for ${s.dur} minutes.</p><div style="display:grid;gap:10px"><button class="btn" onclick="S.sel=S.sch.find(x=>x.id=='${s.id}')?.tag||S.sel;start('${esc(s.tag).replace(/'/g,"\\'")}',${s.dur},'${s.id}')">START FOCUS</button><button class="btn s" onclick="S.occ['${s.id}'+dk(new Date())]='skipped';save();cl()">REJECT</button></div></div></div>`}
 if(v.t=='hist')return`<div class="sheet"><div>${hdr('History')}<div style="margin-top:16px">${S.ses.length?S.ses.slice().reverse().map(x=>`<div class="card"><div class="row sp"><b>${esc(x.tag)}</b><b>${hm(x.sec)}</b></div><div class="mu">${new Date(x.start).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})} – ${new Date(x.end).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})} • ${x.status}</div>${x.note?`<div style="margin-top:6px">${esc(x.note)}</div>`:''}</div>`).join(''):`<div class="card c"><b>Your study journey starts here.</b><div class="mu">Complete your first focus session.</div></div>`}</div></div></div>`;
 if(v.t=='tags')return`<div class="sheet"><div>${hdr('Subjects & tags')}<label for="nt">New tag</label><div class="row"><input type="text" id="nt" maxlength="30" placeholder="e.g. Physics Numericals"><button class="btn sm" onclick="addT()">Add</button></div><div style="margin-top:20px">${S.tags.map((t,i)=>`<div class="card row sp" style="padding:12px 18px"><span>${esc(t)}</span>${i>=6?`<button class="btn sm d" onclick="S.tags.splice(${i},1);if(!S.tags.includes(S.sel))S.sel=S.tags[0];save();render()">Delete</button>`:'<span class="mu">Default</span>'}</div>`).join('')}</div></div></div>`;
 if(v.t=='sched')return`<div class="sheet"><div>${hdr(S.sch.some(s=>s.id==F.id)?'Edit Schedule':'Add Schedule')}
 <label for="sn">Schedule name</label><input type="text" id="sn" value="${esc(F.name)}" placeholder="Physics Numericals" oninput="F.name=this.value">
 <label>Subject</label><div class="chips wr">${S.tags.map(t=>`<button class="chip ${F.tag==t?'on':''}" onclick="fs('tag',S.tags[${S.tags.indexOf(t)}])">${esc(t)}</button>`).join('')}</div>
 <label for="st">Start time</label><input type="time" id="st" value="${F.time}" onchange="F.time=this.value||'19:00'">
 <label>Duration (minutes)</label><div class="chips wr">${[15,25,45,50,60].map(m=>`<button class="chip ${F.dur==m?'on':''}" onclick="fs('dur',${m})">${m}</button>`).join('')}</div><input type="number" min="1" max="240" value="${F.dur}" aria-label="Custom duration" onchange="fs('dur',this.value)">
 <label>Repeat</label><div class="chips wr">${[['once','Once'],['daily','Every day'],['days','Selected days']].map(([k,l])=>`<button class="chip ${F.rep==k?'on':''}" onclick="fs('rep','${k}')">${l}</button>`).join('')}</div>
 ${F.rep=='once'?`<input type="date" value="${F.date}" aria-label="Date" onchange="F.date=this.value||dk(new Date())">`:''}
 ${F.rep=='days'?`<div class="row">${DN.map((d,i)=>`<button class="chip ${F.days.includes(i)?'on':''}" style="padding:0;width:44px;flex:none" aria-label="day ${i}" onclick="F.days=F.days.includes(${i})?F.days.filter(x=>x!=${i}):[...F.days,${i}];render()">${d}</button>`).join('')}</div>`:''}
 <div class="row sp" style="margin-top:20px"><label style="margin:0">Reminder</label>${tg(F.rem>=0,`fs('rem',F.rem>=0?-1:0)`)}</div>
 ${F.rem>=0?`<div class="chips" style="margin-top:8px">${[[0,'At start time'],[5,'5 min before'],[10,'10 min before']].map(([m,l])=>`<button class="chip ${F.rem==m?'on':''}" onclick="fs('rem',${m})">${l}</button>`).join('')}</div>`:''}
 <div style="display:grid;gap:10px;margin-top:28px"><button class="btn" onclick="saveS()">Save schedule</button>${S.sch.some(s=>s.id==F.id)?`<button class="btn d" onclick="S.sch=S.sch.filter(s=>s.id!=F.id);save();cl()">Delete schedule</button>`:''}</div></div></div>`;
 if(v.t=='cd')return`<div class="sheet"><div>${hdr(G.edit?'Edit Countdown':'Add Countdown')}
 <label for="cn">Countdown name</label><input type="text" id="cn" maxlength="40" value="${esc(G.name)}" placeholder="Board Exam" oninput="G.name=this.value">
 <label for="cdt">Date</label><input type="date" id="cdt" value="${G.date}" onchange="G.date=this.value">
 <label for="ctm">Time</label><input type="time" id="ctm" value="${G.time}" onchange="G.time=this.value||'09:00'">
 <label>Category</label><div class="chips wr">${CATS.map(c=>`<button class="chip ${G.cat==c?'on':''}" onclick="G.cat='${c}';render()">${c}</button>`).join('')}</div>
 <div style="display:grid;gap:10px;margin-top:28px"><button class="btn" onclick="saveC()">Save countdown</button>${G.edit?`<button class="btn d" onclick="S.cds[G.i]=null;save();cl()">Delete countdown</button>`:''}</div></div></div>`;
 if(v.t=='settings')return`<div class="sheet"><div>${hdr('Settings')}
 <label for="g1">Daily goal (minutes)</label><input type="number" id="g1" min="15" max="1000" value="${S.set.goal}" onchange="S.set.goal=Math.max(15,+this.value||180);save()">
 <label for="g2">Default focus length (minutes)</label><input type="number" id="g2" min="1" max="240" value="${S.set.dur}" onchange="S.set.dur=Math.max(1,+this.value||45);S.dur=S.set.dur;save()">
 <label>Break length</label><div class="chips">${[5,10].map(m=>`<button class="chip ${S.set.brk==m?'on':''}" onclick="S.set.brk=${m};save();render()">${m} min</button>`).join('')}</div><input type="number" min="1" max="60" value="${S.set.brk}" aria-label="Custom break" onchange="S.set.brk=Math.max(1,+this.value||5);save();render()">
 <div class="row sp" style="margin-top:20px"><span>Light theme</span>${tg(S.set.theme=='light',`S.set.theme=S.set.theme=='light'?'dark':'light';save();render()`)}</div>
 <h2>Distraction Control</h2><div class="card"><div class="row sp"><span>Enable during Focus</span>${tg(S.set.dis,`S.set.dis=!S.set.dis;save();render()`)}</div><div class="row sp" style="margin-top:14px"><span>Strict mode<br><span class="mu">No pause; Finish becomes Emergency exit</span></span>${tg(S.set.strict,`S.set.strict=!S.set.strict;save();render()`)}</div></div>
 <div class="card"><b>Android Focus Mode</b><p class="mu" style="margin-top:6px">Block selected distracting apps during an active focus session.</p><div style="display:grid;gap:8px;margin-top:12px"><button class="btn sm" onclick="try{Android.openAppPicker()}catch(e){}">Choose blocked apps</button><button class="btn sm s" onclick="try{Android.openUsageAccess()}catch(e){}">Usage Access</button><button class="btn sm s" onclick="try{Android.openOverlayAccess()}catch(e){}">Focus Shield permission</button></div></div><div class="card" style="border:1px solid var(--wn)"><b>Distraction protection needs permission</b><p class="mu" style="margin-top:6px">The Android version can shield selected distracting apps during a focus session. Android will ask for Usage Access and Display over other apps permissions. Use the buttons above to configure them.</p></div>
 <div class="card"><b>Install on your phone</b><p class="mu" style="margin-top:6px">In Chrome, open the browser menu (⋮) and tap Add to Home screen. It then opens like an app. Keep the app open for schedule reminders.</p></div><button class="btn s" onclick="op('tags')" style="margin-top:8px">Manage subjects & tags</button></div></div>`;
 return''}
function nt(){const e=$('#note');if(e&&e.value.trim()&&S.ses.length){S.ses[S.ses.length-1].note=e.value.trim();save()}}
function addT(){const e=$('#nt'),t=e.value.trim();if(!t||S.tags.some(x=>x.toLowerCase()==t.toLowerCase()))return;S.tags.push(t);S.sel=t;save();render()}
function render(){document.documentElement.dataset.theme=S.set.theme;const m=T=='focus'?focusV():T=='sched'?schedV():cdV();
 const I={focus:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',sched:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',cd:'<path d="M6 2h12M6 22h12M8 2v4l4 6-4 6v4M16 2v4l-4 6 4 6v4"/>'};
 $('#app').innerHTML=`<main>${m}</main><nav aria-label="Main">${[['focus','Focus'],['sched','Schedule'],['cd','Countdown']].map(([k,l])=>`<button class="${T==k?'on':''}" aria-current="${T==k}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${I[k]}</svg>${l}</button>`).join('')}</nav>${V?sheet():''}`}
S.dur=S.dur||S.set.dur;render();tick();
</script></body></html>
